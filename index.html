<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101218">
<meta name="robots" content="noindex,nofollow">
<title>新嘉通 · 交互原型</title>
<style>
/* ============ 新嘉通 · 交互原型 ============ */
:root{
  --gold:#B5822A;
  --gold-2:#C99A3F;
  --gold-deep:#8A5C12;
  --gold-soft:#FBF0DA;
  --ink:#141619;
  --sub:#8B8B91;
  --muted:#B3B3B8;
  --bg:#F2F3F5;
  --card:#FFFFFF;
  --line:#F1F1F4;
  --red:#D8482A;
  --blue:#2F6FD6;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#101218;color:#E8EAEF;overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font-family:inherit;cursor:pointer}
svg{display:block}

/* ---------------- 舞台 / 顶栏 ---------------- */
.stage{
  position:relative;display:flex;align-items:center;justify-content:center;
  gap:30px;height:100vh;padding:78px 28px 26px;
}
.stage::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(50% 45% at 50% 8%,rgba(196,146,58,.13),transparent 70%),
    radial-gradient(40% 40% at 88% 92%,rgba(82,110,190,.10),transparent 70%);
}
.topbar{
  position:fixed;top:0;left:0;right:0;height:66px;z-index:70;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;pointer-events:none;
}
.brand{display:flex;align-items:center;gap:10px;pointer-events:auto}
.brand .mark{
  width:30px;height:30px;border-radius:9px;
  background:linear-gradient(150deg,#E3B45F,#B17C22);
  display:grid;place-items:center;box-shadow:0 6px 18px rgba(190,140,50,.28);
}
.brand .mark svg{width:17px;height:17px;color:#fff}
.brand h1{font-size:15px;font-weight:600;letter-spacing:.4px;margin:0}
.brand .chip{
  font-size:11px;color:#E2BE7E;border:1px solid rgba(226,190,126,.35);
  border-radius:999px;padding:2px 8px;letter-spacing:.3px;background:rgba(226,190,126,.08);
}
.topbar .meta{font-size:12px;color:#7E8391;letter-spacing:.3px;pointer-events:auto;display:flex;gap:14px;align-items:center}
.topbar .meta b{color:#B9BEC9;font-weight:500}
.mapbtn{
  display:none;align-items:center;gap:6px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);color:#E6E8EE;border-radius:999px;
  padding:8px 14px;font-size:12.5px;backdrop-filter:blur(10px);
}

/* ---------------- 侧边页面地图 ---------------- */
.sidebar{
  position:relative;width:250px;flex:0 0 250px;max-height:calc(100vh - 120px);
  overflow-y:auto;z-index:20;padding:4px 4px 10px;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent;
}
.sidebar::-webkit-scrollbar{width:5px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px}
.side-head{padding:6px 12px 14px}
.side-head h2{font-size:13px;color:#8E93A1;font-weight:500;letter-spacing:1.4px;margin:0 0 6px}
.side-head p{margin:0;font-size:12px;color:#6C7280;line-height:1.6}
.sgroup{margin:16px 0 0}
.sgroup h3{
  font-size:11px;color:#6E7482;letter-spacing:1.6px;font-weight:600;
  margin:0 0 6px;padding:0 12px;display:flex;align-items:center;gap:8px;
}
.sgroup h3::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.07)}
.sitem{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:transparent;border:0;color:#A7ADBB;font-size:13px;
  padding:8px 12px;border-radius:9px;line-height:1.35;
}
.sitem:hover{background:rgba(255,255,255,.055);color:#E7EAF1}
.sitem.active{background:rgba(201,154,63,.15);color:#EBCB92}
.sitem .dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.5;flex:0 0 4px}
.sitem.active .dot{opacity:1;box-shadow:0 0 0 3px rgba(201,154,63,.18)}
.side-foot{margin:22px 12px 4px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:#5D6370;line-height:1.7}
.side-foot b{color:#8A909E;font-weight:500}

/* ---------------- 手机外框 ---------------- */
.device{
  position:relative;flex:0 0 auto;
  width:min(393px,calc(100vw - 40px));
  height:min(852px,calc(100vh - 128px));
  min-height:560px;
  background:#08090B;
  border-radius:54px;padding:11px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.09),
    0 0 0 7px #1B1E24,
    0 0 0 8px rgba(255,255,255,.045),
    0 40px 90px -20px rgba(0,0,0,.85),
    0 10px 30px rgba(0,0,0,.5);
  z-index:30;
}
.device-inner{
  position:relative;height:100%;width:100%;border-radius:44px;overflow:hidden;overflow:clip;
  background:var(--bg);display:flex;flex-direction:column;
}
/* 刘海 */
.device-inner::before{
  content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);
  width:104px;height:26px;background:#08090B;border-radius:20px;z-index:60;pointer-events:none;
}
.statusbar{
  height:50px;flex:0 0 50px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 26px 7px;font-size:13.5px;font-weight:600;color:#121417;
  letter-spacing:.2px;z-index:40;position:relative;
  background:#F5F6F8;transition:background .25s ease;
}
.device[data-theme="warm"] .statusbar{
  background:linear-gradient(180deg,#FBEFDB 0%,#FAF2E4 60%,#F9F4EC 100%);
}
.statusbar .stat-icons{display:flex;align-items:center;gap:5px;color:#121417}
.statusbar .stat-icons svg{opacity:.92}

.screen{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;position:relative;
  background:var(--bg);scrollbar-width:none;overscroll-behavior:contain;
}
.screen::-webkit-scrollbar{display:none}

.home-bar{
  position:absolute;bottom:7px;left:50%;transform:translateX(-50%);
  width:134px;height:5px;border-radius:4px;background:#0C0D0F;opacity:.28;z-index:55;pointer-events:none;
}

/* ---------------- 底部 Tab ---------------- */
.tabbar{
  flex:0 0 auto;display:flex;background:rgba(255,255,255,.985);
  border-top:1px solid #EFEFF2;padding:7px 0 26px;position:relative;z-index:45;
  backdrop-filter:blur(16px);
}
.tabbar.hidden{display:none}
.tabitem{
  flex:1;border:0;background:transparent;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:#A6A29A;font-size:10.5px;letter-spacing:.2px;
  padding:2px 0;position:relative;transition:color .18s;
}
.tabitem svg{width:23px;height:23px}
.tabitem.active{color:#B8842B;font-weight:600}
.tabitem .badge{
  position:absolute;top:-3px;left:calc(50% + 6px);min-width:17px;height:15px;
  background:#EC4B3B;color:#fff;font-size:9.5px;font-weight:600;border-radius:8px;
  display:grid;place-items:center;padding:0 4px;border:1.4px solid #fff;
}

/* ---------------- 二级页导航 ---------------- */
.navbar{
  position:sticky;top:0;z-index:30;height:52px;display:flex;align-items:center;
  background:var(--bg);padding:0 6px;
}
.navbar::after{content:"";position:absolute;inset:0;z-index:-1;background:var(--bg)}
.navbar h2{
  position:absolute;left:0;right:0;text-align:center;margin:0;
  font-size:18px;font-weight:600;letter-spacing:.4px;color:#15171A;pointer-events:none;
}
.iconbtn{
  width:42px;height:42px;border:0;background:transparent;display:grid;place-items:center;
  color:#1B1D21;border-radius:50%;
}
.iconbtn:active{background:rgba(0,0,0,.05)}

/* ---------------- 通用页面结构 ---------------- */
.page{padding:0 16px 34px}
.page.pad-top{padding-top:6px}
.section-title{font-size:17px;font-weight:600;color:#15171A;margin:20px 6px 10px;letter-spacing:.2px}
.card{
  background:var(--card);border-radius:var(--radius);
  box-shadow:0 1px 2px rgba(20,22,26,.03),0 6px 18px rgba(20,22,26,.035);
  overflow:hidden;
}
.card.pad{padding:18px 16px}
.stack>*+*{margin-top:12px}
.muted{color:var(--sub)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}

/* 行式键值 */
.kv{padding:2px 16px}
.kv .row{
  display:flex;justify-content:space-between;align-items:flex-start;gap:18px;
  padding:14px 0;border-bottom:1px solid #F5F5F7;font-size:15px;
}
.kv .row:last-child{border-bottom:0}
.kv .k{color:#8B8B91;flex:0 0 auto;letter-spacing:.2px}
.kv .v{color:#15171A;text-align:right;word-break:break-word;line-height:1.5}
.kv .v.num{font-variant-numeric:tabular-nums}
.kv.tight .row{padding:12px 0}
.kv.compact .row{font-size:13.5px;padding:11px 0;gap:12px}
.kv.compact .v{max-width:64%}

/* ---------------- 首页公共头部 ---------------- */
.root{min-height:100%;padding-bottom:14px}
.root-head{
  position:relative;padding:6px 22px 30px;
  background:
    radial-gradient(120% 95% at 80% -10%,rgba(255,219,166,.72) 0%,rgba(255,219,166,0) 58%),
    radial-gradient(80% 70% at 100% 40%,rgba(226,196,148,.30) 0%,rgba(226,196,148,0) 60%),
    linear-gradient(172deg,#FBEFDB 0%,#FBF6EF 52%,#F4F5F7 100%);
}
.root-head h1{
  margin:0;font-size:26px;font-weight:700;letter-spacing:.6px;color:#131518;
}
.greet{
  margin:26px 0 0;font-size:16px;color:#7E5F2C;font-weight:500;letter-spacing:.2px;
}
.art{
  position:absolute;right:2px;top:-4px;width:200px;height:176px;pointer-events:none;z-index:0;
}
.art .orb{
  position:absolute;right:-30px;top:-10px;width:200px;height:190px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,183,86,.45),rgba(255,201,128,.10) 62%,transparent 75%);
  filter:blur(1px);
}
.art .ring{
  position:absolute;right:26px;top:58px;width:118px;height:44px;border-radius:50%;
  border:2px solid rgba(214,160,70,.45);transform:rotate(-14deg);
}
.art .glyph{
  position:absolute;right:26px;top:18px;width:104px;height:104px;color:#DDA748;
  filter:drop-shadow(0 16px 20px rgba(186,129,32,.30));
}
.art.small .glyph{right:16px;top:-6px;width:82px;height:82px;opacity:.92}
.art.small .orb{right:-52px;top:-34px;width:176px;height:156px}

.root > .body{padding:0 16px;position:relative;z-index:1}

/* 功能格 */
.grid{display:grid;gap:11px}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.grid.g2{grid-template-columns:repeat(2,1fr)}
.fcard{
  background:#fff;border:0;border-radius:15px;padding:20px 8px 16px;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  box-shadow:0 1px 2px rgba(26,24,20,.03),0 8px 20px rgba(26,24,20,.045);
  transition:transform .16s ease,box-shadow .16s ease;
}
.fcard:active{transform:scale(.975)}
.fcard .ic{
  width:58px;height:58px;border-radius:15px;display:grid;place-items:center;
  background:linear-gradient(158deg,#FDF4E4 0%,#FAF7F0 70%,#FFFFFF 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 4px 12px rgba(206,155,66,.10);
  color:#C08E33;
}
.fcard .ic svg{width:34px;height:34px}
.fcard .label{font-size:14px;font-weight:600;color:#1B1D21;letter-spacing:.2px}
.fcard.off{
  opacity:.52;filter:grayscale(1);cursor:not-allowed;box-shadow:none;
  background:linear-gradient(#FBFBFC,#FBFBFC);
}
.fcard.off:active{transform:none}

/* 工作台 banner */
.wb-banner{
  position:relative;overflow:hidden;border-radius:16px;padding:20px 18px;
  background:linear-gradient(104deg,#FFF4E2 0%,#FFEBD0 55%,#FFE7C8 100%);
  box-shadow:0 8px 22px rgba(206,152,60,.10);
  margin-bottom:14px;
}
.wb-banner h3{
  margin:0;font-size:17px;line-height:1.75;font-weight:700;color:#7C4B0C;letter-spacing:.4px;
}
.wb-banner .env{
  position:absolute;right:-4px;bottom:-10px;width:118px;height:96px;color:#E4853A;opacity:.95;
  filter:drop-shadow(0 10px 14px rgba(196,110,40,.22));
}
.wb-banner .env svg{width:100%;height:100%}

/* ---------------- 我的 ---------------- */
.profile{
  display:flex;align-items:center;gap:14px;padding:18px 16px;border-radius:16px;background:#fff;
  position:relative;overflow:hidden;
  box-shadow:0 1px 2px rgba(26,24,20,.03),0 8px 20px rgba(26,24,20,.045);
}
.profile .avatar{
  width:52px;height:52px;border-radius:50%;flex:0 0 52px;display:grid;place-items:center;
  background:linear-gradient(150deg,#E8C281,#C89A45);color:#fff;
  box-shadow:0 6px 14px rgba(190,140,50,.28);
}
.profile .avatar svg{width:30px;height:30px}
.profile .who{flex:1;min-width:0}
.profile .who b{display:block;font-size:19px;font-weight:600;color:#15171A;letter-spacing:.2px}
.profile .who span{display:block;margin-top:4px;font-size:12.5px;color:#8B8B91}
.profile>.chev{margin-left:auto;color:#C4C4C9}
.list-row{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:#fff;border:0;border-bottom:1px solid #F4F4F6;padding:16px;
  font-size:16px;color:#15171A;text-align:left;
}
.list-row:last-child{border-bottom:0}
.list-row .right{display:flex;align-items:center;gap:8px;font-size:14px;color:#C4C4C9}
.list-row .right .gold{color:#C08E33;font-size:14.5px}
.list-row .chev{color:#C9C9CE}

/* ---------------- 搜索 / 筛选 ---------------- */
.searchbar{display:flex;gap:10px;align-items:center;padding:4px 16px 0}
.search{
  flex:1;height:44px;border-radius:10px;background:#fff;display:flex;align-items:center;
  gap:8px;padding:0 12px;color:#B6B6BB;box-shadow:0 1px 2px rgba(20,22,26,.03);
}
.search svg{width:18px;height:18px;flex:0 0 18px}
.search input{
  flex:1;border:0;outline:0;background:transparent;font-size:15px;color:#15171A;
  min-width:0;letter-spacing:.2px;
}
.search input::placeholder{color:#B6B6BB}
.btn-gold{
  height:44px;padding:0 20px;border-radius:10px;border:0;color:#fff;font-size:15px;
  background:linear-gradient(180deg,#C79632,#B07C24);
  box-shadow:0 4px 12px rgba(178,128,38,.22);letter-spacing:.5px;
}
.btn-gold:active{filter:brightness(.95)}

.toolrow{display:flex;align-items:center;gap:26px;padding:14px 20px 4px}
.tool{
  display:flex;align-items:center;gap:7px;font-size:15px;color:#3A3C40;background:none;border:0;padding:2px 0;
}
.tool svg{width:17px;height:17px;color:#C08E33}
.tool.off{color:#A6A6AC;cursor:not-allowed}
.tool.off svg{color:#C9C9CE}

.chiprow{display:flex;gap:6px;padding:14px 16px 2px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 8px;border-radius:999px;
  background:#fff;border:0;font-size:13px;color:#2C2E33;box-shadow:0 1px 2px rgba(20,22,26,.03);
  white-space:nowrap;
}
.chip svg{width:12px;height:12px;color:#9A9AA0}
.chip.on{gap:10px;color:#1B1D21}
.chip.on svg{color:#C08E33}
.chip.off{color:#A9A9AF;cursor:not-allowed;box-shadow:none;background:#F7F7F9}
.chip.off svg{color:#CFCFD4}
.chip.more{color:#C08E33;gap:7px;background:transparent;box-shadow:none;padding-left:2px}
.chip.more svg{width:16px;height:16px;color:#C08E33}

/* ---------------- 客户列表 ---------------- */
.cu-card{
  background:#fff;border-radius:16px;padding:20px 18px 6px;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(20,22,26,.03),0 8px 20px rgba(20,22,26,.04);
}
.cu-card .name{font-size:20px;font-weight:600;color:#15171A;letter-spacing:.4px;margin-bottom:6px}
.cu-card .kv{padding:0}
.cu-card .kv .row{font-size:14.5px;padding:12px 0}
.cu-card .kv .k{color:#8B8B91}

/* 客户详情 */
.cust-hero{
  background:#fff;border-radius:16px;padding:20px 18px;display:flex;align-items:flex-start;
  gap:12px;box-shadow:0 1px 2px rgba(20,22,26,.03),0 8px 20px rgba(20,22,26,.04);
}
.cust-hero .nm{font-size:25px;font-weight:700;letter-spacing:.5px;color:#15171A;line-height:1.2}
.cust-hero .ph{margin-top:9px;font-size:14px;color:#9A9AA0;letter-spacing:.5px}
.cust-hero .tags{display:flex;gap:7px;margin-left:auto;padding-top:4px}
.tag{
  display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:6px;
  background:#FBF1DF;color:#B07C24;font-size:12.5px;white-space:nowrap;
}
.tag.plain{background:#F7F7F9;color:#8B8B91}
.tag.blue{background:#EEF2FC;color:#4B6FD0}
.tag.red{background:#FDF0EC;color:#D8482A}

.acct-link{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;background:#fff;border:0;text-align:left;
}
.acct-link .t{font-size:16.5px;font-weight:600;color:#15171A;padding:16px 0}
.acct-link .chev{color:#C4C4C9}
.acct-link+ .card{margin-top:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 0}
.sec-head b{font-size:16.5px;font-weight:600;color:#15171A}

/* ---------------- 账户详情 ---------------- */
.acct-chip{
  display:inline-flex;align-items:center;background:#fff;border-radius:10px;
  padding:10px 14px;font-size:14px;color:#5F6167;box-shadow:0 1px 2px rgba(20,22,26,.03);
  letter-spacing:.2px;
}
.overview{background:#fff;border-radius:16px;padding:18px 18px 16px;
  box-shadow:0 1px 2px rgba(20,22,26,.03),0 8px 20px rgba(20,22,26,.04)}
.overview .top{display:flex;justify-content:space-between;align-items:flex-start}
.overview .top .l{font-size:15px;color:#3A3C40;display:flex;align-items:center;gap:9px}
.cur-pill{
  display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:8px;
  border:1px solid #ECECEF;background:#fff;font-size:12.5px;color:#4B4D52;
}
.cur-pill .flag{font-size:13px;line-height:1}
.cur-pill svg{width:11px;height:11px;color:#A7A7AC}
.overview .big{font-size:29px;font-weight:600;color:#15171A;letter-spacing:-.3px;margin-top:6px;font-variant-numeric:tabular-nums}
.overview .big.neg{color:#15171A}
.overview .right-v{text-align:right}
.overview .right-v .lbl{font-size:12.5px;color:#8B8B91}
.overview .right-v .val{font-size:15px;color:#15171A;margin-top:6px;font-variant-numeric:tabular-nums}
.ov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 10px;margin-top:20px}
.ov-grid .lbl{font-size:12.5px;color:#8B8B91;letter-spacing:.1px}
.ov-grid .val{font-size:15px;color:#15171A;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.ov-grid .val.red{color:#D8482A}
.shortcuts{background:#fff;border-radius:16px;padding:16px 6px 6px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.shortcut{
  border:0;background:transparent;padding:10px 2px 14px;display:flex;flex-direction:column;
  align-items:center;gap:9px;color:#2B2D31;font-size:12.5px;border-radius:12px;
}
.shortcut:active{background:#FAFAFB}
.shortcut svg{width:31px;height:31px}
.shortcut.off{opacity:.38;filter:grayscale(1);cursor:not-allowed}
.seg{display:flex;gap:9px;padding:4px 16px 0}
.seg .sbtn{
  height:36px;padding:0 18px;border-radius:6px;background:#fff;border:1px solid transparent;
  font-size:14.5px;color:#7C7C82;
}
.seg .sbtn.on{border-color:#C99A3F;color:#B07C24;font-weight:500;background:#FFFDF8}
.seg .sbtn.off{opacity:.4;cursor:not-allowed}
.hold-card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(20,22,26,.03)}
.hold-card h4{margin:0;font-size:16px;font-weight:600;line-height:1.5;color:#15171A;letter-spacing:.2px}
.hold-card .code{font-size:12px;color:#ADADB3;margin-top:7px;letter-spacing:.3px}

.sheet{
  position:absolute;left:50%;bottom:0;transform:translate(-50%,102%);
  width:100%;background:#F7F7F9;border-radius:20px 20px 0 0;
  z-index:90;transition:transform .26s cubic-bezier(.22,.7,.3,1);
  padding:6px 0 28px;box-shadow:0 -10px 40px rgba(0,0,0,.18);
}
.sheet.show{transform:translate(-50%,0)}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px}
.sheet .sh b{font-size:16px;font-weight:600;color:#15171A}
.sheet .sh button{border:0;background:none;font-size:14px;color:#8B8B91;padding:4px}
.sheet .opts{max-height:52vh;overflow-y:auto;padding:6px 10px}
.opt{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  background:#fff;border:0;border-radius:11px;padding:15px 14px;margin-top:8px;
  font-size:15px;color:#2E3035;text-align:left;
}
.opt.on{color:#B07C24;font-weight:500}
.opt svg{width:17px;height:17px;color:#C08E33}
.toast{
  position:absolute;left:50%;bottom:58px;transform:translate(-50%,10px);
  background:rgba(22,24,29,.9);color:#fff;font-size:13px;padding:10px 16px;
  border-radius:10px;z-index:120;opacity:0;pointer-events:none;
  width:max-content;max-width:82%;text-align:center;line-height:1.5;backdrop-filter:blur(8px);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hint{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  font-size:11.5px;color:#5F6572;letter-spacing:.4px;z-index:10;
}

/* ---------------- 响应式 ---------------- */
@media (max-width:1180px){
  .sidebar{width:212px;flex:0 0 212px}
  .stage{gap:20px;padding-left:18px;padding-right:18px}
}
@media (max-width:900px){
  body{background:#0B0D12;overflow:hidden}
  .topbar{display:none}
  .stage{padding:0;gap:0;height:100dvh;display:block}
  .topbar{height:52px;padding:0 14px;pointer-events:none}
  .topbar .meta{display:none}
  .brand .chip{display:none}
  .mapbtn{display:inline-flex;pointer-events:auto}
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:280px;max-height:none;z-index:95;
    background:#151821;padding:74px 8px 20px;transform:translateX(-100%);
    transition:transform .26s cubic-bezier(.22,.7,.3,1);overflow-y:auto;
  }
  .sidebar.open{transform:none}
  .device{
    width:100vw;height:100dvh;min-height:0;border-radius:0;padding:0;box-shadow:none;
  }
  .device-inner{border-radius:0}
  .device-inner::before{display:none}
  .statusbar{height:46px;flex-basis:46px;padding-top:6px;align-items:center}
  .hint{display:none}
  .sheet{width:100vw}
  .toast{bottom:100px}
}
@media (max-height:700px) and (min-width:901px){
  .device{height:calc(100vh - 96px)}
  .stage{padding-top:64px;padding-bottom:10px}
}

/* ---------------- 补充：原型标注 / 交互细节 ---------------- */
.proto-note{
  margin:14px 2px;padding:11px 13px;border:1px dashed #E6D6B9;border-radius:11px;
  background:#FCF7EE;color:#9A7B45;font-size:12px;line-height:1.7;
}
.sec-navrow{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  background:none;border:0;padding:22px 6px 10px;font-size:16.5px;color:#15171A;text-align:left;
}
.sec-navrow b{font-weight:600}
.sec-navrow svg{color:#C4C4C9}
.sec-navrow.off{opacity:.4;cursor:not-allowed}
.art .glyph svg{width:100%;height:100%}
.chart-axis-pill.y{left:0;transform:translate(0,-50%);}
.chart-axis-pill.x{transform:translate(-50%,0);}
.pd-tab.off{color:#B4B4B9;cursor:not-allowed}
.export.off{color:#C9C9CE;cursor:not-allowed}
.doc-row.off{opacity:.45;cursor:not-allowed}
.rule-seg button.off{opacity:.45;cursor:not-allowed}
.chip.more.off{color:#B4B4B9;opacity:.75}
.chip.more.off svg{color:#C9C9CE}
.cash-row .l span.name{color:#A5A5AA}
#sec-base,#sec-nav,#sec-perf,#sec-rule,#sec-doc,#sec-holder,#sec-hero{scroll-margin-top:112px}
.top-fab{
  position:absolute;right:16px;bottom:104px;width:52px;height:52px;border-radius:50%;
  border:0;background:rgba(176,176,182,.86);color:#fff;font-size:11.5px;line-height:1.35;
  display:grid;place-items:center;z-index:52;opacity:0;pointer-events:none;
  backdrop-filter:blur(6px);
  box-shadow:0 6px 20px rgba(20,22,26,.18);letter-spacing:.2px;text-align:center;
}
.top-fab.show{opacity:1;pointer-events:auto}
.steps .step .v{height:18px;line-height:18px}
@media (max-width:900px){
  .top-fab{bottom:96px}
}

/* 我的：渐变铺满整个屏幕 */
.root.mine{background:none}
.root.mine .root-head{background:none;padding-bottom:16px}
.root.mine .profile{padding:20px 16px}
#screen[data-route="mine"]{
  background:
    radial-gradient(105% 46% at 88% -4%,rgba(255,214,155,.62) 0%,rgba(255,214,155,0) 64%),
    linear-gradient(180deg,#FBEFDB 0%,#FCF6EE 30%,#F7F4EF 48%,#F2F3F5 68%,#F2F3F5 100%);
}

/* 银行卡详情 */
.bank-card.bank-hero{display:block;padding:22px 18px 24px}
.bank-hero .no{margin-top:24px;font-size:25px}
.bank-hero .bank-logo{width:34px;height:34px;flex:0 0 34px}
.bank-hero .bank-logo svg{width:19px;height:19px}

/* 客户详情：普通交易账户整块可点，直达账户详情 */
.acct-block{cursor:pointer;border-radius:16px}
.acct-block .sec-navrow{padding-bottom:12px}
.acct-block .card{margin-top:0}
.acct-block:active .card{background:#FBFBFD}
.acct-block:focus-visible{outline:2px solid #C99A3F;outline-offset:2px}
@media (hover:hover){
  .acct-block:hover .card{background:#FDFDFE}
}

/* ---------- 产品详情：卡片内标题 / 排序 / 文档 ---------- */
.pd-block{margin-top:16px}
.pd-card-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:18px 16px 4px;
}
.pd-card-head h3{margin:0;font-size:17px;font-weight:600;color:#15171A;letter-spacing:.2px}
.pd-card-head + .kv{padding-top:0}
.pd-card-head + .kv .row:first-child{padding-top:10px}
.pd-card-head + .perf-head{margin-top:2px}
.sort-btn{
  display:inline-flex;align-items:center;gap:5px;background:none;border:0;
  color:#C08E33;font-size:13.5px;padding:2px 0;letter-spacing:.2px;
}
.sort-btn svg{width:15px;height:15px;color:#C08E33}
.rule-seg{border-bottom:0}
.doc-row{font-family:inherit}

</style>

/* ---------------- 我的资产 ---------------- */
function chartGeom() {
  const W = 340, H = 216, L = 48, R = 332, T = 18, B = 172;
  const n = CHART.values.length;
  const pts = CHART.values.map((v, i) => ({
    x: L + (R - L) * i / (n - 1),
    y: T + (B - T) * (1 - (v - CHART.yMin) / (CHART.yMax - CHART.yMin))
  }));
  return { W, H, L, R, T, B, pts };
}

const CHART_DATES = (() => {
  const iso = d => `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
  const out = [];
  const jan1 = Date.UTC(2026, 0, 1);
  for (let i = 0; i < 12; i++) out.push(iso(new Date(jan1 + Math.round(i * 10 / 11) * 86400000)));
  const start = Date.UTC(2026, 0, 20), end = Date.UTC(2026, 8, 14);
  for (let i = 0; i < 19; i++) out.push(iso(new Date(start + (end - start) * i / 18)));
  return out;
})();

const chartAmount = (i) => {
  if (i === CHART.marker) return '+989.80';
  const a = CHART.values[i] * 10000;
  return `${a >= 0 ? '+' : '-'}${Math.abs(a).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
};

const chartWan = (v) => `${v >= 0 ? '' : '-'}${Math.abs(v).toFixed(2)}万`;

function smoothPath(pts) {
  let d = `M${pts[0].x.toFixed(2)} ${pts[0].y.toFixed(2)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C${c1x.toFixed(2)} ${c1y.toFixed(2)} ${c2x.toFixed(2)} ${c2y.toFixed(2)} ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
  }
  return d;
}

function chartSvg() {
  const { W, H, L, R, T, B, pts } = chartGeom();
  const marker = pts[CHART.marker];
  const yOf = v => T + (B - T) * (1 - (v - CHART.yMin) / (CHART.yMax - CHART.yMin));

  const grid = CHART.grid.map(v => {
    const y = yOf(v);
    return `<line x1="${L}" y1="${y.toFixed(1)}" x2="${R}" y2="${y.toFixed(1)}" stroke="#DFDFE5" stroke-width="1" stroke-dasharray="3 4"/>
      <text x="${L - 8}" y="${(y + 3.5).toFixed(1)}" text-anchor="end" font-size="10.5" fill="#A9A9AF">${chartWan(v)}</text>`;
  }).join('');

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="盈亏趋势图">
    ${grid}
    <line id="cv" x1="${marker.x}" y1="${T}" x2="${marker.x}" y2="${B}" stroke="#BDBDC5" stroke-width="1" stroke-dasharray="3 4"/>
    <line id="ch" x1="${L}" y1="${marker.y}" x2="${marker.x}" y2="${marker.y}" stroke="#BDBDC5" stroke-width="1" stroke-dasharray="3 4"/>
    <path d="${smoothPath(pts)}" fill="none" stroke="#4C74C9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle id="cd" cx="${marker.x}" cy="${marker.y}" r="4.6" fill="#4C74C9" stroke="#fff" stroke-width="2.4"/>
    <text x="${L}" y="${H - 8}" font-size="10.5" fill="#A9A9AF">2026-01-01</text>
    <text x="${R}" y="${H - 8}" text-anchor="end" font-size="10.5" fill="#A9A9AF">2026-09-14</text>
  </svg>`;
}

/* ---------------- 渲染 ---------------- */
function renderTabs(active) {
  tabbar.innerHTML = TABS.map(t => `
    <button class="tabitem ${t.id === active ? 'active' : ''}" data-tab="${t.id}">
      ${t.icon}<span>${t.label}</span>
      ${t.badge ? `<span class="badge">${t.badge}</span>` : ''}
    </button>`).join('');
}

function render() {
  const cur = state.stack[state.stack.length - 1];
  const view = VIEWS[cur.route] || viewCustomer;
  screen.innerHTML = view(cur.params || {});
  screen.scrollTop = 0;

  const root = ROOTS.includes(cur.route);
  screen.dataset.route = cur.route;
  tabbar.classList.toggle('hidden', !root);
  device.dataset.theme = root ? 'warm' : 'plain';
  renderTabs(root ? cur.route : null);
  renderMap();
  syncFab(cur.route);
  afterRender(cur);
}

function afterRender(cur) {
  if (cur.route === 'assets') initChart();
  if (cur.route === 'customer-list') {
    bindSearch('cuSearch');
    filterCustomers();
  }
  if (cur.route === 'product-list') {
    bindSearch('pSearch');
    filterProducts();
  }
  if (cur.route === 'product-detail') {
    // tab 高亮已在 HTML 中根据 ui.tab 生成，滚动由 spy 更新
  }
}

function rerender(keepScroll = true) {
  const y = screen.scrollTop;
  render();
  if (keepScroll) screen.scrollTop = y;
  const cur = state.stack[state.stack.length - 1];
  if (cur && cur.route === 'product-detail') spyPd();
}

/* ---------------- 导航 ---------------- */
function go(route, params) {
  if (ROOTS.includes(route)) {
    state.stack = [{ route, params: params || {} }];
  } else {
    state.stack.push({ route, params: params || {} });
  }
  render();
}

function back() {
  if (state.stack.length > 1) {
    state.stack.pop();
    render();
  }
}

function buildTrail(route, params) {
  const chain = [];
  let r = route;
  let p = params || DEFAULTS[route] || {};
  while (r) {
    chain.unshift({ route: r, params: p });
    const parent = PARENT[r];
    if (!parent) break;
    r = parent;
    p = DEFAULTS[r] || {};
  }
  return chain;
}

function jump(route) {
  state.stack = buildTrail(route);
  render();
  sidebar.classList.remove('open');
  scrim.classList.remove('show');
}

/* ---------------- 搜索 / 筛选 ---------------- */
function bindSearch(id) {
  const input = document.getElementById(id);
  if (!input) return;
  input.addEventListener('input', () => {
    if (id === 'cuSearch') {
      state.ui.customerQ = input.value;
      filterCustomers();
    } else {
      state.ui.products.q = input.value;
      filterProducts();
    }
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      id === 'cuSearch' ? filterCustomers() : filterProducts();
      input.blur();
    }
  });
}

function filterCustomers() {
  const q = (state.ui.customerQ || '').trim().toLowerCase();
  let shown = 0;
  $$('#cuList .cu-card').forEach(el => {
    const hit = !q || (el.dataset.search || '').toLowerCase().includes(q);
    el.style.display = hit ? '' : 'none';
    if (hit) shown++;
  });
  const empty = $('#cuEmpty');
  if (empty) empty.hidden = shown > 0;
}

function filterProducts() {
  const q = (state.ui.products.q || '').trim().toLowerCase();
  let shown = 0;
  $$('[data-pcard]').forEach(el => {
    const hit = !q || (el.dataset.search || '').toLowerCase().includes(q);
    el.style.display = hit ? '' : 'none';
    if (hit) shown++;
  });
  const empty = $('#pEmpty');
  if (empty) empty.hidden = shown > 0;
}

function getPath(path) {
  return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), state.ui);
}

function setPath(path, value, keepScroll = true) {
  const segs = path.split('.');
  let o = state.ui;
  for (let i = 0; i < segs.length - 1; i++) o = o[segs[i]];
  o[segs[segs.length - 1]] = value;
  rerender(keepScroll);
}

let sheetKey = null;

function openSheet(key) {
  const cfg = SHEETS[key];
  if (!cfg) return;
  sheetKey = key;
  const cur = getPath(cfg.path);
  sheet.innerHTML = `
    <div class="sh"><b>${cfg.title}</b><button data-close>完成</button></div>
    <div class="opts">
      ${cfg.options.map(o => `
        <button class="opt ${o === cur ? 'on' : ''}" data-pick="${o}">${o}${o === cur ? CHECK : ''}</button>`).join('')}
    </div>`;
  sheet.classList.add('show');
  sheet.setAttribute('aria-hidden', 'false');
  scrim.classList.add('show');
}

function closeSheet() {
  sheet.classList.remove('show');
  sheet.setAttribute('aria-hidden', 'true');
  scrim.classList.remove('show');
  sheetKey = null;
}

sheet.addEventListener('click', (e) => {
  if (e.target.closest('[data-close]')) { closeSheet(); return; }
  const pick = e.target.closest('[data-pick]');
  if (pick) {
    const cfg = SHEETS[sheetKey];
    const value = pick.dataset.pick;
    closeSheet();
    if (cfg) setPath(cfg.path, value);
  }
});

scrim.addEventListener('click', () => {
  closeSheet();
  sidebar.classList.remove('open');
  scrim.classList.remove('show');
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeSheet();
    sidebar.classList.remove('open');
    scrim.classList.remove('show');
  }
});

/* ---------------- 图表 ---------------- */
function initChart() {
  const wrap = $('#chartWrap');
  if (!wrap) return;
  const svg = wrap.querySelector('svg');
  const tip = $('#chartTip'), pillY = $('#pillY'), pillX = $('#pillX');
  const vline = $('#cv'), hline = $('#ch'), dot = $('#cd');
  if (!svg || !tip || !vline) return;

  const g = chartGeom();
  const { W, H, T, B, L, pts } = g;

  function setMarker(i) {
    i = Math.max(0, Math.min(pts.length - 1, i));
    const p = pts[i];
    const xPct = p.x / W * 100;
    const yPct = p.y / H * 100;

    vline.setAttribute('x1', p.x.toFixed(1));
    vline.setAttribute('x2', p.x.toFixed(1));
    hline.setAttribute('x1', L);
    hline.setAttribute('x2', p.x.toFixed(1));
    hline.setAttribute('y1', p.y.toFixed(1));
    hline.setAttribute('y2', p.y.toFixed(1));
    dot.setAttribute('cx', p.x.toFixed(1));
    dot.setAttribute('cy', p.y.toFixed(1));

    tip.innerHTML = `${CHART_DATES[i]}<b>${chartAmount(i)}</b>`;
    tip.style.left = `${Math.min(64, Math.max(3, xPct + 2))}%`;
    tip.style.top = `${yPct}%`;
    tip.style.marginTop = '-12px';

    pillY.textContent = chartWan(CHART.values[i]);
    pillY.style.top = `${yPct}%`;
    pillX.textContent = CHART_DATES[i];
    pillX.style.left = `${xPct}%`;
    pillX.style.top = `${B / H * 100}%`;
  }

  setMarker(CHART.marker);

  const onMove = (e) => {
    const r = svg.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * W;
    let best = 0, bd = Infinity;
    pts.forEach((p, i) => {
      const d = Math.abs(p.x - x);
      if (d < bd) { bd = d; best = i; }
    });
    setMarker(best);
  };
  svg.addEventListener('pointermove', onMove);
  svg.addEventListener('pointerdown', onMove);
  svg.addEventListener('pointerleave', () => setMarker(CHART.marker));
}

function syncFab(route) {
  const old = document.getElementById('fab');
  if (old) old.remove();
  if (route !== 'account-detail') return;
  const btn = document.createElement('button');
  btn.id = 'fab';
  btn.className = 'top-fab';
  btn.innerHTML = '回到<br>顶部';
  btn.addEventListener('click', () => screen.scrollTo({ top: 0, behavior: 'smooth' }));
  document.querySelector('.device-inner').appendChild(btn);
}

/* ---------------- 滚动 ---------------- */
screen.addEventListener('scroll', () => {
  const fab = document.getElementById('fab');
  if (fab) fab.classList.toggle('show', screen.scrollTop > 60);

  const cur = state.stack[state.stack.length - 1];
  if (cur && cur.route === 'product-detail') spyPd();
});

function spyPd() {
  const secs = $$('[data-pdsec]');
  if (!secs.length) return;
  const atBottom = screen.scrollTop + screen.clientHeight >= screen.scrollHeight - 6;
  const top = screen.getBoundingClientRect().top + 118;
  let active = secs[0].id;
  secs.forEach(s => {
    if (s.getBoundingClientRect().top <= top) active = s.id;
  });
  if (atBottom) active = secs[secs.length - 1].id;
  state.ui.pd.tab = active;
  $$('.pd-tab').forEach(t => t.classList.toggle('on', t.dataset.target === active));
}

/* ---------------- 事件 ---------------- */
screen.addEventListener('click', (e) => {
  const backBtn = e.target.closest('[data-back]');
  if (backBtn) { back(); return; }

  const nav = e.target.closest('[data-nav]');
  if (nav) {
    const id = nav.dataset.id;
    go(nav.dataset.nav, id ? { id } : undefined);
    return;
  }

  const act = e.target.closest('[data-act]');
  if (!act) return;

  switch (act.dataset.act) {
    case 'overview':
      state.ui.overview = !state.ui.overview;
      rerender(false);
      break;
    case 'chip':
      setPath(act.dataset.path, act.dataset.value);
      break;
    case 'sheet':
      openSheet(act.dataset.sheet);
      break;
    case 'more':
      toast('截图只包含这 5 条盈亏明细');
      break;
    case 'toast':
      toast(act.dataset.msg || '演示原型');
      break;
    case 'searchCustomer':
      filterCustomers();
      break;
    case 'searchProduct':
      filterProducts();
      break;
    case 'pdtab': {
      const target = act.dataset.target;
      state.ui.pd.tab = target;
      $$('.pd-tab').forEach(t => t.classList.toggle('on', t.dataset.target === target));
      const el = document.getElementById(target);
      if (el) {
        const top = el.getBoundingClientRect().top - screen.getBoundingClientRect().top + screen.scrollTop - 104;
        screen.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
      }
      break;
    }
    case 'rule':
      state.ui.pd.rule = act.dataset.value;
      rerender(true);
      break;
    case 'top':
      screen.scrollTo({ top: 0, behavior: 'smooth' });
      break;
  }
});

/* 让 [role=button] 的整块卡片支持键盘回车/空格 */
screen.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest('[data-nav][role="button"]');
  if (!el) return;
  e.preventDefault();
  el.click();
});

tabbar.addEventListener('click', (e) => {
  const tab = e.target.closest('[data-tab]');
  if (!tab) return;
  state.stack = [{ route: tab.dataset.tab, params: {} }];
  render();
});

      ['product-list', '证券产品列表'], ['product-detail', '产品详情']
    ]

];

function renderMap() {
  const nav = $('#sidelist');
  if (!nav.dataset.built) {
    nav.innerHTML = MAP.map(g => `
      <div class="sgroup">
        <h3>${g.group}</h3>
        ${g.items.map(([route, label]) => `
          <button class="sitem" data-map="${route}"><span class="dot"></span>${label}</button>`).join('')}
      </div>`).join('');
    nav.dataset.built = '1';
    nav.addEventListener('click', (e) => {
      const item = e.target.closest('[data-map]');
      if (item) jump(item.dataset.map);
    });
  }
  const cur = state.stack[state.stack.length - 1].route;
  $$('.sitem').forEach(el => el.classList.toggle('active', el.dataset.map === cur));
}

$('#mapbtn').addEventListener('click', () => {
  sidebar.classList.add('open');
  scrim.classList.add('show');
});

/* ---------------- 启动 ---------------- */
render();
